name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      build_variant:
        description: 'Build variant to compile'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

permissions:
  contents: write

jobs:
  build:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4

      - name: 🟢 Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: ☕ Set up Java Development Kit (JDK) 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: 📝 Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔍 Validate TypeScript code
        run: npm run typecheck

      - name: 🧪 Run automated unit tests
        run: npm test

      - name: ⚙️ Generate native Android project (Expo Prebuild)
        run: npx expo prebuild --platform android --clean

      - name: 🔑 Configure Gradle permissions
        run: chmod +x android/gradlew

      - name: 🔨 Compile Android APK with Gradle
        working-directory: android
        run: |
          if [ "${{ github.event.inputs.build_variant }}" = "release" ] && [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "Building signed Release APK..."
            ./gradlew assembleRelease --no-daemon --stacktrace
          else
            echo "Building Installable Android APK..."
            ./gradlew assembleDebug --no-daemon --stacktrace
          fi

      - name: 🔍 Verify APK output exists
        id: verify_apk
        run: |
          echo "Checking Android APK output directory..."
          APK_FILE=$(find android/app/build/outputs/apk -type f -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "❌ Error: No APK file was generated by Gradle."
            exit 1
          fi
          echo "✅ Found APK at: $APK_FILE"
          APK_SIZE=$(ls -lh "$APK_FILE" | awk '{print $5}')
          echo "APK File Size: $APK_SIZE"
          mkdir -p build-output
          cp "$APK_FILE" build-output/Barbie-Period-Tracker.apk
          echo "apk_path=build-output/Barbie-Period-Tracker.apk" >> $GITHUB_OUTPUT

      - name: 📤 Upload APK Artifact to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: Barbie-Period-Tracker-Android-APK
          path: build-output/Barbie-Period-Tracker.apk
          retention-days: 30

      - name: 🚀 Publish Direct APK to GitHub Releases
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "Barbie Period Tracker v1.0.0 (Direct APK)"
          body: |
            ### 🎀 Barbie Period Tracker - Android APK Direct Download

            Click the **`Barbie-Period-Tracker.apk`** file below under **Assets** to download the standalone APK directly to your phone (no unzipping required!).

            - **Filename**: `Barbie-Period-Tracker.apk`
            - **Package**: `com.barbie.periodtracker`
            - **Platform**: Android
            - **License**: 100% Free Forever
          files: build-output/Barbie-Period-Tracker.apk
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 📋 Capture Build Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-failure-logs
          path: |
            android/app/build/reports/
            android/app/build/outputs/logs/
