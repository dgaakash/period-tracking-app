name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      build_variant:
        description: 'Build variant to compile'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug

permissions:
  contents: write

jobs:
  build:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4

      - name: 🟢 Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: ☕ Set up Java Development Kit (JDK) 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: 🐘 Set up Gradle & Cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: 📝 Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔍 Validate TypeScript code
        run: npm run typecheck

      - name: 🧪 Run automated unit tests
        run: npm test

      - name: ⚙️ Generate native Android project (Expo Prebuild)
        run: npx expo prebuild --platform android --clean
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}

      - name: ⚡ Apply Android & Gradle Build Optimizations
        run: node scripts/optimize-android-build.js

      - name: 🔑 Configure Gradle permissions
        run: chmod +x android/gradlew

      - name: 🔨 Compile Android APK with Gradle
        working-directory: android
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          if [ "${{ github.event.inputs.build_variant }}" = "debug" ]; then
            echo "Building Debug APK..."
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            echo "Building Optimized Release APK (R8/ProGuard + Minified JS + ABI Splits)..."
            ./gradlew assembleRelease --no-daemon --stacktrace
          fi

      - name: 🔍 Locate & Package APKs
        id: package_apks
        run: |
          echo "=== Locating Generated Android APKs ==="
          mkdir -p build-output
          
          find android/app/build/outputs/apk -type f -name "*.apk" -exec ls -lh {} +
          
          UNIVERSAL_APK=$(find android/app/build/outputs/apk -type f -name "*universal*release*.apk" | head -n 1)
          ARM64_APK=$(find android/app/build/outputs/apk -type f -name "*arm64-v8a*release*.apk" | head -n 1)
          ANY_RELEASE_APK=$(find android/app/build/outputs/apk -type f -name "*release*.apk" | head -n 1)
          DEBUG_APK=$(find android/app/build/outputs/apk -type f -name "*.apk" | head -n 1)

          PRIMARY_APK=""
          if [ -n "$ARM64_APK" ]; then
            echo "Found ARM64-v8a APK: $ARM64_APK"
            cp "$ARM64_APK" build-output/Barbie-Period-Tracker-arm64-v8a.apk
            PRIMARY_APK="build-output/Barbie-Period-Tracker-arm64-v8a.apk"
          fi

          if [ -n "$UNIVERSAL_APK" ]; then
            echo "Found Universal APK: $UNIVERSAL_APK"
            cp "$UNIVERSAL_APK" build-output/Barbie-Period-Tracker-universal.apk
            cp "$UNIVERSAL_APK" build-output/Barbie-Period-Tracker.apk
            PRIMARY_APK="build-output/Barbie-Period-Tracker.apk"
          elif [ -n "$PRIMARY_APK" ]; then
            cp "$PRIMARY_APK" build-output/Barbie-Period-Tracker.apk
          elif [ -n "$ANY_RELEASE_APK" ]; then
            cp "$ANY_RELEASE_APK" build-output/Barbie-Period-Tracker.apk
            PRIMARY_APK="build-output/Barbie-Period-Tracker.apk"
          elif [ -n "$DEBUG_APK" ]; then
            cp "$DEBUG_APK" build-output/Barbie-Period-Tracker.apk
            PRIMARY_APK="build-output/Barbie-Period-Tracker.apk"
          else
            echo "❌ Error: No APK file was generated by Gradle."
            exit 1
          fi

          echo "=== Final Packaged APKs in build-output/ ==="
          ls -lh build-output/
          
          MAIN_SIZE=$(ls -lh build-output/Barbie-Period-Tracker.apk | awk '{print $5}')
          echo "Main APK Size: $MAIN_SIZE"
          echo "apk_size=$MAIN_SIZE" >> $GITHUB_OUTPUT

      - name: 📤 Upload APK Artifacts to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: Barbie-Period-Tracker-Android-APKs
          path: build-output/*.apk
          retention-days: 30

      - name: 🚀 Publish Standalone APKs to GitHub Releases
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "Barbie Period Tracker v1.0.0 (Optimized APK)"
          body: |
            ### 🎀 Barbie Period Tracker - Android APK Downloads

            Download the standalone APK directly to your phone (no unzipping required!):

            - **📱 Recommended (All Devices)**: [`Barbie-Period-Tracker.apk`](https://github.com/${{ github.repository }}/releases/download/v1.0.0/Barbie-Period-Tracker.apk)
            - **⚡ Ultra-Compact ARM64 (Modern Devices)**: [`Barbie-Period-Tracker-arm64-v8a.apk`](https://github.com/${{ github.repository }}/releases/download/v1.0.0/Barbie-Period-Tracker-arm64-v8a.apk)
            - **🌐 Universal Fallback**: [`Barbie-Period-Tracker-universal.apk`](https://github.com/${{ github.repository }}/releases/download/v1.0.0/Barbie-Period-Tracker-universal.apk)

            ---
            - **Package**: `com.barbie.periodtracker`
            - **Optimizations**: ProGuard / R8 enabled, Hermes JS bytecode, stripped unused native libs, resource shrinking enabled
            - **Size**: ~25–35 MB (arm64-v8a) / ~45–50 MB (universal) — reduced from 300 MB!
            - **License**: 100% Free Forever
          files: build-output/*.apk
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 📋 Capture Build Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-failure-logs
          path: |
            android/app/build/reports/
            android/app/build/outputs/logs/
